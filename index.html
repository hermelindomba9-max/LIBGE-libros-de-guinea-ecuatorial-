@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#080e20;--card:#121a33;--tx:#eef2ff;--mu:#97a5c7;--bd:#22305a;--bl:#5b8df0;--glass:#0e1730cc;--sh:0 8px 24px #0006}}
:root[data-theme=dark]{--bg:#080e20;--card:#121a33;--tx:#eef2ff;--mu:#97a5c7;--bd:#22305a;--bl:#5b8df0;--glass:#0e1730cc;--sh:0 8px 24px #0006}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;height:100%}html{scroll-padding-top:env(safe-area-inset-top,0px);scroll-behavior:smooth}
body{background:var(--bg);color:var(--tx);font:15px/1.5 "Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
#app{max-width:760px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;position:relative}
.full{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;padding:24px;text-align:center;gap:16px}
.logo{width:150px;height:150px;border-radius:34px;box-shadow:0 18px 50px #0b3a8f40}
.fade{animation:f .9s cubic-bezier(.2,.8,.2,1) both}@keyframes f{from{opacity:0;transform:translateY(14px) scale(.95)}}
main>*,.box{animation:u .35s ease both}@keyframes u{from{opacity:0;transform:translateY(8px)}}
h1,h2,h3{margin:0;letter-spacing:-.02em}.mu{color:var(--mu)}.sm{font-size:13px}
.box{background:var(--card);border:1px solid var(--bd);border-radius:24px;padding:26px;width:100%;max-width:440px;text-align:left;box-shadow:var(--sh)}
label{display:block;font-size:12px;font-weight:700;color:var(--mu);margin:14px 0 6px;letter-spacing:.02em;text-transform:uppercase}
input,select{width:100%;padding:14px 16px;border-radius:14px;border:1.5px solid var(--bd);background:var(--bg);color:var(--tx);-webkit-text-fill-color:var(--tx);caret-color:var(--tx);font:inherit;font-size:16px;opacity:1;transition:.2s}
input:focus,select:focus{outline:0;border-color:var(--bl);box-shadow:0 0 0 4px #0b3a8f22;background:var(--card)}
.pw{position:relative}.pw input{padding-right:50px}.eye{position:absolute;right:6px;top:50%;transform:translateY(-50%);border:0;background:none;font-size:19px;cursor:pointer;padding:8px;-webkit-text-fill-color:initial}
.btn{border:0;border-radius:14px;padding:14px 20px;font:inherit;font-weight:700;background:linear-gradient(135deg,#0b3a8f,#1558c9);color:#fff;cursor:pointer;box-shadow:0 6px 16px #0b3a8f40;transition:.2s}
.btn:hover{transform:translateY(-1px)}.btn:active{transform:scale(.97)}
.btn.g{background:linear-gradient(135deg,#2f9208,#46bd1a);box-shadow:0 6px 16px #34a30c40}.btn.o{background:transparent;color:var(--bl);border:1.5px solid var(--bd);box-shadow:none}
.btn.r{background:linear-gradient(135deg,#d4221b,#f0463f);box-shadow:none}.row{display:flex;gap:10px;margin-top:20px}.row .btn{flex:1}
.err{color:var(--rd);font-size:13px;font-weight:600;min-height:18px;margin-top:8px}
.bar{height:8px;background:var(--bd);border-radius:9px;overflow:hidden;margin:12px 0 6px}.bar i{display:block;height:100%;border-radius:9px;background:linear-gradient(90deg,var(--bl),var(--gr));transition:width .4s}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;display:flex;align-items:center;gap:10px;padding:10px 18px;background:var(--glass);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-bottom:1px solid var(--bd)}
.top img{width:36px;height:36px;border-radius:10px}.top b{font-size:19px;letter-spacing:.08em;flex:1;font-weight:800}
.av{width:38px;height:38px;border-radius:50%;background:linear-gradient(135deg,var(--bl),var(--gr));color:#fff;display:grid;place-items:center;font-weight:800;cursor:pointer;box-shadow:0 4px 12px #0b3a8f40}
.head{padding:28px 22px 34px;color:#fff;border-radius:0 0 32px 32px;position:relative;overflow:hidden}
.head:after{content:"";position:absolute;right:-40px;top:-40px;width:180px;height:180px;border-radius:50%;background:#ffffff1f}
.head h2{font-size:26px;font-weight:800;position:relative}.head p{margin:4px 0 0;opacity:.9;position:relative}
main{flex:1;padding:20px 16px 120px}
.nav{position:fixed;bottom:0;left:0;right:0;display:flex;justify-content:center;z-index:6;padding:0 14px calc(10px + env(safe-area-inset-bottom,0px));pointer-events:none}
.nav div{display:flex;width:100%;max-width:440px;background:var(--glass);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border:1px solid var(--bd);border-radius:26px;box-shadow:0 12px 36px #0d1b3d2e;padding:6px;pointer-events:auto}
.nav button{flex:1;border:0;background:none;color:var(--mu);padding:8px 0 6px;font:inherit;font-size:11px;font-weight:600;cursor:pointer;border-radius:20px;transition:.2s}
.nav button.on{color:#fff;background:linear-gradient(135deg,#0b3a8f,#1558c9)}.nav span{display:grid;place-items:center;margin-bottom:2px}.nav svg{width:22px;height:22px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:20px;padding:16px;margin-bottom:12px;display:flex;align-items:center;gap:14px;cursor:pointer;box-shadow:var(--sh);transition:.2s}
.card:hover{transform:translateY(-2px)}.card:active{transform:scale(.98)}.card b{font-size:16px}
.dot{width:50px;height:50px;border-radius:16px;flex:none;display:grid;place-items:center;color:#fff;font-weight:800;font-size:18px;box-shadow:0 6px 14px #0003}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:16px}
.cur{border-radius:22px;padding:30px 10px;color:#fff;font-weight:800;text-align:center;cursor:pointer;font-size:20px;box-shadow:0 10px 24px #0003;transition:.2s}.cur:hover{transform:translateY(-3px)}
.book{cursor:pointer;transition:.2s}.book:hover{transform:translateY(-4px)}
.cover{aspect-ratio:3/4;border-radius:4px 16px 16px 4px;padding:14px;color:#fff;display:flex;flex-direction:column;justify-content:space-between;position:relative;overflow:hidden;box-shadow:inset 7px 0 0 #00000030,inset 9px 0 0 #ffffff22,0 14px 28px #0d1b3d40}
.cover:before{content:"";position:absolute;inset:12% 6% 28% 6%;background:var(--emb) center/contain no-repeat;opacity:.3;filter:blur(1.6px) brightness(1.6) saturate(.8);mix-blend-mode:screen}
.cover:after{content:"";position:absolute;right:-30px;bottom:-30px;width:110px;height:110px;border-radius:50%;background:#ffffff14}
.crest{width:78%;max-width:130px;height:auto;align-self:center;background:#fff;border-radius:14px;padding:6px;position:relative;box-shadow:0 6px 16px #0003;image-rendering:auto}.em{align-self:center;width:66%;background:#fff;border-radius:14px;padding:5px;position:relative;box-shadow:0 6px 16px #0003}.cover b{font-size:15px;line-height:1.2;position:relative}.cover small{opacity:.85;position:relative;font-size:11px;font-weight:600}.emb{width:46px;height:auto;background:#fff;border-radius:10px;padding:4px;align-self:flex-start;position:relative;box-shadow:0 3px 8px #0003}.bt{font-size:13px;font-weight:700;margin:10px 2px 0}
.back{background:var(--card);border:1px solid var(--bd);color:var(--bl);font:inherit;font-weight:700;padding:8px 16px;margin-bottom:16px;cursor:pointer;border-radius:12px;box-shadow:var(--sh)}
.view{background:var(--card);border:1px solid var(--bd);border-radius:20px;height:62vh;overflow:auto;display:grid;place-items:center;text-align:center;box-shadow:var(--sh)}
.view iframe{width:100%;height:100%;border:0}.tools{display:flex;gap:8px;align-items:center;justify-content:center;margin-top:14px;flex-wrap:wrap}.tools .btn{padding:10px 16px}
.foot{text-align:center;padding:10px 18px 0;color:var(--mu);font-size:12px;display:flex;gap:8px;justify-content:center;align-items:center}.foot img{width:20px;border-radius:6px}
.bg:after{content:"";position:absolute;inset:0;background:var(--lg) center/min(74vw,380px) no-repeat;opacity:.09}
.bg{position:fixed;inset:0;z-index:-1;background:radial-gradient(circle at 10% 0,#0b3a8f26,transparent 45%),radial-gradient(circle at 95% 100%,#34a30c26,transparent 45%),radial-gradient(#0b3a8f12 1px,transparent 1px) 0 0/20px 20px}
.li{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid var(--bd)}.li img{max-height:70px;border-radius:10px}
.pf p{display:flex;justify-content:space-between;margin:0;padding:13px 0;border-bottom:1px solid var(--bd)}.pf span{color:var(--mu)}
.cover:after,.view:before{content:"";position:absolute;background:var(--esc) center/contain no-repeat;pointer-events:none;z-index:0}

if(!S.read){m.innerHTML=BK+`<div style="max-width:240px;margin:0 auto" class="book"><div class="cover" style="background:${gradS(b.m)}"><img class="emb" src="${EMB}" alt=""><small>${b.n} · ${b.c}</small><div><b style="font-size:20px">${esc(b.m)}</b><br><small>LIBGE</small></div></div></div><p class="mu sm" style="text-align:center">${S.url?"Última página leída: "+S.pg:"Aún no hay archivo para este libro."}</p><div class="row" style="max-width:300px;margin:12px auto"><button class="btn g" id="op">${S.pg>1?"Retomar lectura":"Abrir"}</button></div><div class="row" style="max-width:300px;margin:0 auto"><button class="btn o" id="fv">${ls.g("fav",[]).includes(b.id)?"★ En favoritos":"☆ Añadir a favoritos"}</button></div><div style="text-align:center;margin:12px auto;max-width:300px">${ls.g("mk:"+b.id,[]).map(q=>`<button class="btn o" data-p="${q}" style="flex:none;padding:6px 12px;margin:3px">🔖 Pág. ${q}</button>`).join("")}</div>`;
$("#bk").onclick=()=>{S.b=null;shell()};$("#op").onclick=()=>{S.read=true;book(m)};$("#fv").onclick=()=>{const f=ls.g("fav",[]),i=f.indexOf(b.id);i<0?f.push(b.id):f.splice(i,1);ls.s("fav",f);book(m)};m.querySelectorAll("[data-p]").forEach(e=>e.onclick=()=>{S.pg=+e.dataset.p;S.read=true;book(m)});return}
const draw=()=>{const v=$("#vw");ls.s("pg:"+b.id,S.pg);ls.s("last",{id:b.id});$("#mk").textContent=ls.g("mk:"+b.id,[]).includes(S.pg)?"🔖 Quitar marcador":"🔖 Marcar página";$("#pn").textContent="Pág. "+S.pg;$("#zn").textContent=Math.round(S.z*100)+"%";
if(!S.url)v.innerHTML=`<p class="mu" style="padding:20px">Aquí se mostrará el contenido del libro.<br><span class="sm">El administrador aún no ha subido este libro.</span></p>`;
else if(S.kind=="pdf"){const f=v.querySelector("iframe"),src=S.url+`#page=${S.pg}&zoom=${Math.round(S.z*100)}`;if(!f)v.innerHTML=`<iframe src="${src}"></iframe>`;else f.src=src}
else v.innerHTML=`<img src="${S.url}" style="width:${S.z*100}%;max-width:none">`};
m.innerHTML=`<button class="back" id="bk">← Volver</button><div class="view" id="vw"></div><div class="tools"><button class="btn o" id="pv">◀</button><b id="pn"></b><button class="btn o" id="nx">▶</button><span style="width:14px"></span><button class="btn o" id="zm">A−</button><span id="zn" class="sm"></span><button class="btn o" id="zp">A+</button>${S.kind=="pdf"?`<a class="btn o" style="text-decoration:none;text-align:center" target="_blank" href="${S.url}">Abrir PDF</a>`:""}</div><div class="tools" style="margin-top:8px"><button class="btn o" id="mk">🔖</button>${S.kind=="pdf"&&!S.url.startsWith("blob:")?'<button class="btn o" id="dl">⬇ Guardar sin internet</button>':""}</div>`;
$("#bk").onclick=()=>{S.read=false;book(m)};$("#pv").onclick=()=>{if(S.pg>1){S.pg--;draw()}};$("#nx").onclick=()=>{S.pg++;draw()};
$("#zm").onclick=()=>{S.z=Math.max(.7,+(S.z-.1).toFixed(1));draw()};$("#zp").onclick=()=>{S.z=Math.min(2,+(S.z+.1).toFixed(1));draw()};
$("#mk").onclick=()=>{const k="mk:"+b.id,a=ls.g(k,[]),i=a.indexOf(S.pg);i<0?a.push(S.pg):a.splice(i,1);ls.s(k,a.sort((x,y)=>x-y));draw()};
if($("#dl"))$("#dl").onclick=async()=>{const d=$("#dl");d.textContent="Descargando…";try{const r=await fetch(S.url);if(!r.ok)throw 0;const bl=await r.blob();await tx("books","readwrite",st=>st.put({blob:bl,type:"application/pdf",name:b.m+".pdf"},b.id));book(m)}catch{d.textContent="No se pudo descargar"}};draw()}
function admin(m){H("Administración","Subir libros");
if(!S.adm){m.innerHTML=`<div class="box" style="margin:0 auto"><h3>Zona protegida</h3><p class="mu sm">Introduce la contraseña de administrador.</p><input id="ap" type="password"><div class="err" id="ae"></div><div class="row"><button class="btn" id="ao">Entrar</button></div></div>`;
const g=()=>{if(okAd($("#ap").value)){S.adm=true;admin(m)}else $("#ae").textContent="Contraseña incorrecta"};$("#ao").onclick=g;$("#ap").onkeydown=e=>{if(e.key==="Enter")g()};return}
const opt=(a,p)=>`<option value="">${p}</option>`+a.map(x=>`<option>${esc(x)}</option>`).join("");
m.innerHTML=`<div class="box" style="margin:0 auto 14px;max-width:none"><label>Nivel</label><select id="an">${opt(Object.keys(DATA),"Elige…")}</select><label>Curso</label><select id="ac"></select><label>Materia</label><select id="am"></select><p class="mu sm" id="fn"></p><label>Archivo (PDF o imagen)</label><input id="af" type="file" accept="application/pdf,image/*"><div class="err" id="ae"></div><div class="row"><button class="btn g" id="up">Subir libro</button></div></div><h3 style="margin:18px 0 6px">Libros subidos</h3><div id="ls"></div>`;
$("#an").onchange=()=>{const n=$("#an").value;$("#ac").innerHTML=opt(n?DATA[n].cursos:[],"Elige…");$("#am").innerHTML=opt([],"Elige…")};
$("#ac").onchange=()=>{const n=$("#an").value,c=$("#ac").value;$("#am").innerHTML=opt(c?DATA[n].mat(DATA[n].cursos.indexOf(c)):[],"Elige…")};
$("#am").onchange=()=>{const n=$("#an").value,c=$("#ac").value,mt=$("#am").value;$("#fn").innerHTML=mt?"Para que lo vean todos, sube el PDF a la carpeta <b>libros</b> de GitHub con el nombre: <b>"+fileUrl(bid(n,c,mt)).slice(6)+"</b>":""};
$("#up").onclick=async()=>{const n=$("#an").value,c=$("#ac").value,mt=$("#am").value,f=$("#af").files[0];if(!n||!c||!mt||!f)return $("#ae").textContent="Elige nivel, curso, materia y archivo.";
try{await tx("books","readwrite",s=>s.put({blob:f,type:f.type,name:f.name},bid(n,c,mt)));$("#ae").style.color="var(--gr)";$("#ae").textContent="Libro subido ✓";list()}catch{$("#ae").textContent="No se pudo guardar el archivo."}};
async function list(){const k=await tx("books","readonly",s=>s.getAllKeys()),box=$("#ls");box.innerHTML=k.length?k.map(x=>`<div class="li"><span>${esc(x.split("|").reverse().join(" · "))}</span><button class="btn r" data-k="${esc(x)}" style="padding:8px 12px">Eliminar</button></div>`).join(""):'<p class="mu sm">Todavía no hay libros.</p>';
box.querySelectorAll("[data-k]").forEach(b=>b.onclick=async()=>{await tx("books","readwrite",s=>s.delete(b.dataset.k));list()})}list()}
async function galeria(m){H("Mi galería","Espacio privado");m.innerHTML=`<div class="box" style="margin:0 auto 14px;max-width:none"><input id="gf" type="file" multiple accept="application/pdf,image/*"><div class="row"><button class="btn g" id="ga">Añadir</button></div></div><div id="gl"></div>`;
const L=async()=>{const a=await tx("gal","readonly",s=>s.getAll());$("#gl").innerHTML=a.length?a.map(x=>`<div class="li"><div style="display:flex;gap:12px;align-items:center;min-width:0">${x.type.startsWith("image")?`<img src="${URL.createObjectURL(x.blob)}">`:'<span style="font-size:34px">📄</span>'}<span style="word-break:break-all">${esc(x.name)}</span></div><button class="btn r" data-i="${x.id}" style="padding:8px 12px">Eliminar</button></div>`).join(""):'<p class="mu sm">Tu galería está vacía.</p>';
$("#gl").querySelectorAll("[data-i]").forEach(b=>b.onclick=async()=>{await tx("gal","readwrite",s=>s.delete(b.dataset.i));L()})};
$("#ga").onclick=async()=>{for(const f of $("#gf").files)await tx("gal","readwrite",s=>s.put({id:Date.now()+Math.random()+"",name:f.name,type:f.type,blob:f}));$("#gf").value="";L()};L()}
function perfil(m,u){H("Mi perfil",u.usr);m.innerHTML=`<div class="box pf" style="margin:0 auto;max-width:none"><p><span>Nombre</span><b>${esc(u.nombre+" "+u.apellidos)}</b></p><p><span>Centro</span><b>${esc(u.centro)}</b></p><p><span>Nivel</span><b>${esc(u.nivel)}</b></p><p><span>Curso</span><b>${esc(u.curso)}</b></p><p><span>Teléfono</span><b>${esc(u.tel)}</b></p><p><span>Usuario</span><b>${esc(u.usr)}</b></p><p class="mu sm" style="margin:16px 0 0"><b>Cómo usar LIBGE:</b> en Inicio elige nivel, curso y materia, o usa el buscador. Marca ★ tus libros favoritos. En iPhone, para instalar: Compartir → Añadir a pantalla de inicio.</p>${DIP?'<div class="row"><button class="btn g" id="in">Instalar app</button></div>':""}<div class="row"><button class="btn o" id="th">Tema: ${THN[ls.g("theme","auto")]}</button></div><div class="row"><button class="btn o" id="lo">Cerrar sesión</button></div><div class="row" id="dz"><button class="btn r" id="bd">Cerrar sesión y borrar mis datos</button></div></div>`;
$("#lo").onclick=()=>{try{sessionStorage.clear()}catch{}delete SMEM.in;delete SMEM.adm;login()};
$("#th").onclick=()=>{const c=ls.g("theme","auto"),n=TH[(TH.indexOf(c)+1)%3];ls.s("theme",n);setTh(n);perfil(m,u)};
if($("#in"))$("#in").onclick=async()=>{DIP.prompt();await DIP.userChoice;DIP=null;perfil(m,u)};
$("#bd").onclick=()=>{$("#dz").outerHTML=`<div id="dz"><p class="err" style="min-height:0">Se borrarán de este dispositivo tu perfil, usuario, contraseña, progreso de lectura y tu galería. No se puede deshacer.</p><div class="row" style="margin-top:12px"><button class="btn o" id="bn">Cancelar</button><button class="btn r" id="by">Sí, borrar todo</button></div></div>`;$("#bn").onclick=()=>perfil(m,u);$("#by").onclick=wipeAll}}
async function wipeAll(){const b=$("#by");if(b){b.disabled=true;b.textContent="Borrando…"}
try{localStorage.clear()}catch{}try{sessionStorage.clear()}catch{}try{setTh("auto")}catch{}
for(const k in MEM)delete MEM[k];for(const k in SMEM)delete SMEM[k];
try{await tx("gal","readwrite",st=>st.clear())}catch{}
if(S.url){try{URL.revokeObjectURL(S.url)}catch{}}
S={tab:"inicio",n:null,c:null,b:null,q:"",pg:1,z:1,reg:{},step:1,url:null,kind:null,read:false};splash()}
new MutationObserver(()=>{app.querySelectorAll('input[type=password]').forEach(i=>{if(i.parentElement.classList.contains('pw'))return;const w=document.createElement('div');w.className='pw';i.replaceWith(w);w.appendChild(i);const b=document.createElement('button');b.type='button';b.className='eye';b.textContent='👁';b.onclick=()=>{i.type=i.type=='password'?'text':'password';i.focus()};w.appendChild(b)})}).observe(app,{childList:true,subtree:true});
splash();
</script><script>if("serviceWorker" in navigator){window.addEventListener("load",function(){navigator.serviceWorker.register("sw.js").catch(function(e){console.warn("SW",e)})})}</script></body></html>
